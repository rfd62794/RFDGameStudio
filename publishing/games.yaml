# itch.io publishing registry for RFDGameStudio, read by the itch_publisher
# package (packages/itch_publisher) via studio_mcp/publishing.py.
# Keys match game_ids in ts/src/games/game-metadata.json.
# Relative paths resolve from this folder.
games:
  # VoidDrift is built in its own repo; its itch.io slug keeps the old spelling.
  voiddrift:
    itchio_slug: rdug627/voidrift
    channel: html5
    build_dir: C:\Github\VoidDrift\pkg
    source_dir: C:\Github\VoidDrift
    version_file: C:\Github\VoidDrift\VERSION

  brewfield:
    itchio_slug: rdug627/brewfield
    channel: html5
    build_dir: ../ts/dist-brewfield
    source_dir: ../ts/src/games/brewfield
    version_file: ../ts/src/games/brewfield/VERSION

  shoal:
    itchio_slug: rdug627/shoal
    channel: html5
    build_dir: ../ts/dist-shoal
    source_dir: ../ts/src/games/shoal
    version_file: ../ts/src/games/shoal/VERSION

  slimeworld:
