name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # game-metadata dates come from git history

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      # A few simulation tests (Shoal, MBB) are flaky under full-suite load but
      # pass in isolation; reruns keep them from failing CI while still showing
      # up as RERUN in the log.
      - name: Run tests (slow and e2e excluded)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: uv run python -m pytest -m "not e2e and not slow" -q --reruns 2

  typescript:
    name: TypeScript tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # game-metadata dates come from git history

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Generate game-metadata.json
        run: uv run --no-project python -m studio_mcp.game_metadata

      - name: Install dependencies
        working-directory: ts
        run: npm ci

      - name: Run tests
        working-directory: ts
        run: npx vitest run --retry=2
